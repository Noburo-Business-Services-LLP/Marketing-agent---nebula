    <path d="M28 40 L28 26 L46 26"/><path d="M292 40 L292 26 L274 26"/>
    <path d="M28 140 L28 154 L46 154"/><path d="M292 140 L292 154 L274 154"/>
  </g>
  <circle cx="42" cy="38" r="5" fill="#ff4b4b"/>
  <g fill="#fff" opacity="0.4"><circle cx="206" cy="70" r="8"/><circle cx="184" cy="88" r="5"/><circle cx="222" cy="56" r="4.5"/></g>
  <rect width="320" height="180" fill="url(#vig)"/>
