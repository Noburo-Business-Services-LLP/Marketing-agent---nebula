<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="daily-life-vlog">
  <defs>
    <radialGradient id="vig" cx="50%" cy="44%" r="78%">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc3f7"/><stop offset="0.6" stop-color="#ffd486"/>
      <stop offset="1" stop-color="#f6a04d"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#day)"/>
  <circle cx="248" cy="42" r="26" fill="#fff6d0" filter="url(#soft)"/>
  <circle cx="248" cy="42" r="12" fill="#fffdf2"/>
  <g fill="#fff" opacity="0.65" filter="url(#tiny)"><ellipse cx="72" cy="38" rx="28" ry="10"/><ellipse cx="96" cy="32" rx="18" ry="8"/><ellipse cx="182" cy="24" rx="20" ry="7"/></g>
  <path d="M0 112 Q60 96 122 108 Q192 122 320 100 L320 180 L0 180 Z" fill="#7fae56"/>
  <path d="M0 132 Q80 120 160 130 Q240 140 320 124 L320 180 L0 180 Z" fill="#5d8a3d" opacity="0.95"/>
  <path d="M0 158 Q90 148 170 158 Q250 168 320 154 L320 180 L0 180 Z" fill="#3f6329"/>
  <g fill="#33521f" opacity="0.9"><ellipse cx="46" cy="112" rx="13" ry="16"/><rect x="44" y="118" width="3" height="14"/><ellipse cx="282" cy="106" rx="10" ry="12"/><rect x="281" y="112" width="2.5" height="12"/></g>
  <g>
    <path d="M104 180 q22 -54 52 -54 q30 0 52 54 z" fill="#2f4a1e"/>
    <circle cx="156" cy="112" r="19" fill="#2f4a1e"/>
    <rect x="180" y="112" width="30" height="22" rx="4" fill="#223814"/>
    <circle cx="195" cy="123" r="7" fill="#8fd0ff" opacity="0.85"/>
    <path d="M180 118 L164 112 L164 126 Z" fill="#223814"/>
