    </filter>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11161d"/><stop offset="1" stop-color="#232c38"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b63"/><stop offset="1" stop-color="#0b2340"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#room)"/>
  <path d="M64 34 L256 34 L286 150 L34 150 Z" fill="#5aa9ff" opacity="0.09" filter="url(#soft2)"/>
