<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="social-media-reel">
  <defs>
    <radialGradient id="vig" cx="50%" cy="44%" r="78%">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <linearGradient id="reel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e93"/><stop offset="0.5" stop-color="#a726ff"/><stop offset="1" stop-color="#3a1cff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f4d"/><stop offset="1" stop-color="#12062a"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#reel)"/>
  <g opacity="0.28" filter="url(#soft2)"><circle cx="54" cy="46" r="34" fill="#ffd6f5"/><circle cx="272" cy="140" r="40" fill="#7ef0ff"/></g>
  <g fill="#fff" opacity="0.18"><circle cx="240" cy="40" r="5"/><circle cx="262" cy="66" r="3.4"/><circle cx="66" cy="126" r="4.4"/><circle cx="44" cy="100" r="2.8"/></g>
  <rect x="122" y="14" width="76" height="152" rx="15" fill="#0d0520" opacity="0.55"/>
  <rect x="124" y="16" width="72" height="148" rx="14" fill="#1a0a33"/>
  <rect x="129" y="21" width="62" height="138" rx="10" fill="url(#screen)"/>
  <circle cx="160" cy="90" r="26" fill="#fff" opacity="0.14"/>
  <path d="M152 78 L178 90 L152 102 Z" fill="#fff"/>
  <rect x="148" y="19" width="24" height="4" rx="2" fill="#0d0520"/>
  <g fill="#fff" opacity="0.5"><rect x="135" y="136" width="34" height="3.4" rx="1.7"/><rect x="135" y="144" width="22" height="3.4" rx="1.7"/></g>
