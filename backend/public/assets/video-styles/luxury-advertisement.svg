<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="luxury-advertisement">
  <defs>
    <radialGradient id="vig" cx="50%" cy="44%" r="78%">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <linearGradient id="lux" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="0.55" stop-color="#161208"/><stop offset="1" stop-color="#0a0906"/>
    </linearGradient>
    <linearGradient id="au" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c9"/><stop offset="0.35" stop-color="#e8c266"/>
      <stop offset="0.62" stop-color="#a9812c"/><stop offset="1" stop-color="#f0d489"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a54a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f3dc9c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c9a54a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#lux)"/>
  <g fill="none" stroke="url(#silk)">
    <path d="M-10 128 q80 -50 160 -22 q80 28 180 -18" stroke-width="1.6"/>
    <path d="M-10 146 q90 -46 170 -18 q80 28 170 -22" stroke-width="1.1" opacity="0.6"/>
    <path d="M-10 40 q90 34 160 10 q70 -24 180 6" stroke-width="1" opacity="0.4"/>
  </g>
  <ellipse cx="160" cy="92" rx="72" ry="52" fill="#e8c266" opacity="0.07" filter="url(#soft2)"/>
  <g>
    <path d="M160 44 L192 76 L160 132 L128 76 Z" fill="url(#au)"/>
    <path d="M128 76 L192 76" stroke="#5c4413" stroke-width="1" opacity="0.55"/>
    <path d="M160 44 L160 132" stroke="#fff6da" stroke-width="0.9" opacity="0.5"/>
    <path d="M160 44 L128 76 L160 76 Z" fill="#fff6da" opacity="0.28"/>
    <path d="M160 76 L192 76 L160 132 Z" fill="#000" opacity="0.2"/>
  </g>
  <circle cx="160" cy="88" r="34" fill="none" stroke="#e8c266" stroke-width="0.8" opacity="0.35"/>
  <circle cx="160" cy="88" r="46" fill="none" stroke="#e8c266" stroke-width="0.6" opacity="0.18"/>
  <g fill="#ffeec2"><circle cx="118" cy="52" r="1.3" opacity="0.8"/><circle cx="214" cy="60" r="1" opacity="0.6"/><circle cx="228" cy="112" r="1.2" opacity="0.5"/><circle cx="96" cy="110" r="0.9" opacity="0.55"/><circle cx="186" cy="34" r="0.8" opacity="0.4"/></g>
  <rect width="320" height="180" fill="url(#vig)"/>
  <rect width="320" height="180" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay"/>
</svg>
