<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="product-advertisement">
  <defs>
    <radialGradient id="vig" cx="50%" cy="44%" r="78%">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3ff"/><stop offset="0.62" stop-color="#c2d8f0"/>
      <stop offset="0.63" stop-color="#a8c4e2"/><stop offset="1" stop-color="#7f9dc0"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fd0"/><stop offset="1" stop-color="#17407f"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17407f" stop-opacity="0.4"/><stop offset="1" stop-color="#17407f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#sweep)"/>
  <ellipse cx="120" cy="30" rx="120" ry="60" fill="#fff" opacity="0.55" filter="url(#soft2)"/>
  <ellipse cx="160" cy="118" rx="76" ry="9" fill="#000" opacity="0.18" filter="url(#soft)"/>
  <g>
    <path d="M132 62 L160 50 L192 62 L192 112 L160 124 L132 112 Z" fill="url(#box)"/>
    <path d="M132 62 L160 74 L192 62" fill="none" stroke="#8fc0ff" stroke-width="1.6" opacity="0.8"/>
    <path d="M160 74 L160 124" stroke="#0e2c58" stroke-width="1.6" opacity="0.7"/>
    <path d="M132 62 L160 50 L160 74 Z" fill="#ffffff" opacity="0.16"/>
  </g>
  <path d="M132 126 L160 138 L192 126 L192 150 L160 162 L132 150 Z" fill="url(#fade)" opacity="0.55"/>
  <circle cx="196" cy="52" r="3" fill="#fff" opacity="0.9"/>
  <rect width="320" height="180" fill="url(#vig)"/>
  <rect width="320" height="180" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay"/>
</svg>
