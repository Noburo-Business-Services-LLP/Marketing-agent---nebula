<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="testimonial">
  <defs>
    <radialGradient id="vig" cx="50%" cy="44%" r="78%">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2c63"/><stop offset="0.6" stop-color="#7a4a80"/>
      <stop offset="1" stop-color="#c98a9b"/>
    </linearGradient>
    <radialGradient id="rim" cx="70%" cy="35%" r="60%">
      <stop offset="0" stop-color="#ffd9e6" stop-opacity="0.6"/><stop offset="1" stop-color="#ffd9e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="180" fill="url(#warm)"/>
  <rect width="320" height="180" fill="url(#rim)"/>
  <g fill="#ffffff" opacity="0.16" filter="url(#soft)"><circle cx="252" cy="44" r="26"/><circle cx="60" cy="146" r="20"/></g>
  <g>
    <path d="M56 180 q24 -58 56 -58 q32 0 56 58 z" fill="#241a3d"/>
    <circle cx="112" cy="94" r="27" fill="#2c2049"/>
    <rect x="105" y="116" width="14" height="12" fill="#241a3d"/>
    <path d="M131 75 a27 27 0 0 1 0 38" fill="none" stroke="#ffd9e6" stroke-width="5.5" opacity="0.5" stroke-linecap="round"/>
  </g>
  <g fill="#ffe9f2" opacity="0.92">
    <path d="M196 54 q-15 0 -15 17 t15 17 h11 v-17 q0 -17 -11 -17 z"/>
    <path d="M238 54 q-15 0 -15 17 t15 17 h11 v-17 q0 -17 -11 -17 z"/>
