  <g fill="#ffe9f2" opacity="0.55"><rect x="182" y="106" width="94" height="5" rx="2.5"/><rect x="182" y="120" width="76" height="5" rx="2.5"/><rect x="182" y="134" width="56" height="5" rx="2.5"/></g>
  <g fill="#ffd166"><path d="M182 152 l3 6 6 1 -4.5 4.4 1 6.4 -5.5 -3 -5.5 3 1 -6.4 -4.5 -4.4 6 -1 z"/><path d="M204 152 l3 6 6 1 -4.5 4.4 1 6.4 -5.5 -3 -5.5 3 1 -6.4 -4.5 -4.4 6 -1 z"/><path d="M226 152 l3 6 6 1 -4.5 4.4 1 6.4 -5.5 -3 -5.5 3 1 -6.4 -4.5 -4.4 6 -1 z"/></g>
  <rect width="320" height="180" fill="url(#vig)"/>
  <rect width="320" height="180" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay"/>
