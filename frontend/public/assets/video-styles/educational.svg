<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="educational">
  <defs>
    <radialGradient id="vig" cx="50%" cy="44%" r="78%">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <linearGradient id="edu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d3e"/><stop offset="1" stop-color="#1c6b5a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ef2c4"/><stop offset="1" stop-color="#33b98a"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#edu)"/>
  <g stroke="#ffffff" stroke-width="0.6" opacity="0.09">
    <path d="M0 40 H320 M0 70 H320 M0 100 H320 M0 130 H320"/>
    <path d="M40 0 V180 M80 0 V180 M120 0 V180 M160 0 V180 M200 0 V180 M240 0 V180 M280 0 V180"/>
  </g>
  <ellipse cx="200" cy="40" rx="90" ry="46" fill="#7ef7d0" opacity="0.1" filter="url(#soft2)"/>
  <g fill="url(#bar)">
    <rect x="84" y="106" width="22" height="40" rx="3" opacity="0.7"/>
    <rect x="116" y="88" width="22" height="58" rx="3" opacity="0.82"/>
    <rect x="148" y="66" width="22" height="80" rx="3"/>
    <rect x="180" y="80" width="22" height="66" rx="3" opacity="0.88"/>
    <rect x="212" y="52" width="22" height="94" rx="3"/>
  </g>
  <path d="M95 100 L127 82 L159 58 L191 72 L223 44" fill="none" stroke="#eafff6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#eafff6"><circle cx="95" cy="100" r="3.6"/><circle cx="127" cy="82" r="3.6"/><circle cx="159" cy="58" r="3.6"/><circle cx="191" cy="72" r="3.6"/><circle cx="223" cy="44" r="4.6"/></g>
  <path d="M70 146 L246 146" stroke="#eafff6" stroke-width="2" opacity="0.45"/>
  <rect width="320" height="180" fill="url(#vig)"/>
  <rect width="320" height="180" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay"/>
</svg>
