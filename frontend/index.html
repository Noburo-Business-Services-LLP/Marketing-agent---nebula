      // Configure tailwind when it loads
      function configureTailwind() {
        if (typeof tailwind !== 'undefined' && tailwind.config) {
          tailwind.config = {
            darkMode: 'class',
            theme: {
              extend: {
                colors: {
                  nebula: {
                    dark: '#070A12',
                    gold: '#ffcc29',
                    silver: '#ededed',
                  },
                  // Gravity design system (v2 redesign)
                  gravity: {
                    bg:       '#0A0A0A',  // app background — deep warm black
                    sidebar:  '#111111',  // slightly lifted sidebar
                    surface:  '#151515',  // card / panel surface
                    surface2: '#1A1A1A',  // elevated card
                    border:   'rgba(255,255,255,0.06)',
                    borderStrong: 'rgba(255,255,255,0.10)',
                    gold:     '#F5A623',  // primary accent
                    goldSoft: 'rgba(245,166,35,0.15)',
                    text:     '#F5F4F1',  // warm off-white
                    textMuted:'rgba(255,255,255,0.55)',
                    textDim:  'rgba(255,255,255,0.35)',
                    success:  '#4ADE80',
                    info:     '#60A5FA',
                  }
                },
                fontFamily: {
                  serif: ['"Playfair Display"', 'Georgia', 'serif'],
                  sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                }
              }
            }
          };
          return true;
        }
        return false;
      }
      
      // Retry configuration
      var configRetries = 0;
      function tryConfigureTailwind() {
        if (!configureTailwind() && configRetries < 100) {
          configRetries++;
          setTimeout(tryConfigureTailwind, 50);
        }
      }
      tryConfigureTailwind();

      body {

      /* Gravity redesign — applied when body has .gravity-shell class.
         Uses the token pair above so this now actually varies by theme —
         previously hardcoded dark regardless of .dark, which is why light
         mode had no visible effect on Gravity pages at all. */

        background-color: var(--gv-bg) !important;
        color: var(--gv-text-primary) !important;
      }
      /* Ambient gold radial glow for the Gravity shell — subtle, top-right */

        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(60% 45% at 78% 12%, rgba(245,166,35,0.10) 0%, rgba(245,166,35,0) 60%);
      }
      /* Serif display utility */
      .font-serif-display { font-family: 'Playfair Display', Georgia, serif; }

      /* ============================================================
         GRAVITY OVERRIDE LAYER
         Auto-restyles common Tailwind patterns on ALL pages when the
         Gravity shell is active — buttons, cards, inputs, borders,
         old yellow #ffcc29 becomes gold #F5A623, etc. Non-breaking.
         Light only: the dark-era classes (text-white, bg-slate-900,
         bg-white/5, ...) are mapped onto the cream --gv-* palette so
         text, boxes and borders keep WCAG AA contrast; text on a
         saturated/gradient fill or an intentionally dark surface keeps
         its light colour (see LIGHT SEMANTICS below).
         The LIGHT SEMANTICS block is GENERATED: edit the lists in
         frontend/scripts/visual-audit/gen-layer-lists.mjs and run
         `node scripts/visual-audit/gen-layer-lists.mjs` (a unit test
         fails while the block is out of date). New code should not rely
         on this layer: use the --gv-* tokens directly. An intentionally
         dark panel that no class identifies can carry
         data-nb-surface="dark".
         Known trade-off: high-alpha saturated fills (bg-red-500/90,
         /80) count as light tints, so their text is ink (4.8:1 on
         red-500/90) rather than white (3.7:1).
         ============================================================ */
      body.gravity-shell {
        --grav-gold: #F5A623;
        --grav-gold-hover: #ffb833;
        /* Light semantics: the layer follows the cream palette (was the dark theme). */
        --grav-bg: var(--gv-bg);
        --grav-surface: var(--gv-panel);
        --grav-surface-2: var(--gv-panel-2);
        --grav-border: var(--gv-border-subtle);
        --grav-border-strong: var(--gv-border-default);
        --grav-text: var(--gv-text-primary);
        --grav-text-muted: var(--gv-text-tertiary);
      }

        --gv-border-strong: #BFAC85;

        --gv-lav: #ECE6FB;
        --gv-shadow-card: 0 1px 2px rgba(20,32,58,.05), 0 12px 32px rgba(20,32,58,.07);
        --gv-accent-hover: #D68C0F;
        --gv-accent-fill: rgba(245,166,35,0.10);
        --gv-accent-ink: #1A1208;
        /* Raw channels so Tailwind's own /NN opacity-modifier syntax can be
           applied to the accent — a bare var(--gv-accent)/NN silently
           resolves to transparent, since Tailwind cannot inject an alpha
           channel into an opaque var() reference. Use

      /* ------------------------------------------------------------------

         it never drifts amber against the app's gold accents.

      .metalHalo {
        position: absolute;
        inset: -18px;
        border-radius: 32px;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(60% 130% at 50% 0%,   rgba(245,166,35,0.30) 0%, rgba(245,166,35,0) 70%),
          radial-gradient(75% 150% at 50% 100%, rgba(255,196,84,0.20) 0%, rgba(255,196,84,0) 72%);
        filter: blur(26px);
        animation: metal-breathe 5.5s ease-in-out infinite;
      }
      /* Tight inner rim-light so the edge itself looks like lit gold. */
      .metalHalo::after {

        position: absolute;

        border-radius: 18px;

      /* ------------------------------------------------------------------

         Softer and wider than .metalHalo, which sits around a compact input;
         these panels are full-width and tall, so the same intensity would

      /* z-index:0 makes this its own stacking context, which matters inside a

      .gravity-glow::before {
        content: '';
        position: absolute;
        inset: -14px;
        border-radius: 30px;
        pointer-events: none;
        z-index: -1;

          radial-gradient(55% 90% at 50% 0%,   rgba(245,166,35,0.16) 0%, rgba(245,166,35,0) 70%),
          radial-gradient(65% 100% at 50% 100%, rgba(255,196,84,0.11) 0%, rgba(255,196,84,0) 72%);

        -webkit-mask-repeat: no-repeat, no-repeat;

        -webkit-mask-size: 52% 46%, 40% 40%;

      @keyframes ig-morph {
