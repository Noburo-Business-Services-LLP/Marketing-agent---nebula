<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebulaa AI - Marketing Agent</title>
    <!-- Tailwind CSS via Play CDN - more reliable -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      // Configure tailwind when it loads
      function configureTailwind() {
        if (typeof tailwind !== 'undefined' && tailwind.config) {
          tailwind.config = {
            darkMode: 'class',
            theme: {
              extend: {
                colors: {
                  nebula: {
                    dark: '#070A12',
                    gold: '#ffcc29',
                    silver: '#ededed',
                  },
                  // Gravity design system (v2 redesign)
                  gravity: {
                    bg:       '#0A0A0A',  // app background — deep warm black
                    sidebar:  '#111111',  // slightly lifted sidebar
                    surface:  '#151515',  // card / panel surface
                    surface2: '#1A1A1A',  // elevated card
                    border:   'rgba(255,255,255,0.06)',
                    borderStrong: 'rgba(255,255,255,0.10)',
                    gold:     '#F5A623',  // primary accent
                    goldSoft: 'rgba(245,166,35,0.15)',
                    text:     '#F5F4F1',  // warm off-white
                    textMuted:'rgba(255,255,255,0.55)',
                    textDim:  'rgba(255,255,255,0.35)',
                    success:  '#4ADE80',
                    info:     '#60A5FA',
                  }
                },
                fontFamily: {
                  serif: ['"Playfair Display"', 'Georgia', 'serif'],
                  sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                }
              }
            }
          };
          return true;
        }
        return false;
      }
      
      // Retry configuration
      var configRetries = 0;
      function tryConfigureTailwind() {
        if (!configureTailwind() && configRetries < 100) {
          configRetries++;
          setTimeout(tryConfigureTailwind, 50);
        }
      }
      tryConfigureTailwind();
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Gravity redesign — applied when body has .gravity-shell class */
      body.gravity-shell,
      html.dark body.gravity-shell {
        background-color: #0A0A0A !important;
        color: #F5F4F1 !important;
      }
      /* Ambient gold radial glow for the Gravity shell — subtle, top-right */
      body.gravity-shell::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(60% 45% at 78% 12%, rgba(245,166,35,0.10) 0%, rgba(245,166,35,0) 60%);
      }
      /* Serif display utility */
      .font-serif-display { font-family: 'Playfair Display', Georgia, serif; }
      /* Small-caps meta label used across Gravity screens */
      .gravity-label {
        font-family: 'Inter', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 10.5px;
        font-weight: 600;
        color: rgba(255,255,255,0.45);
      }
      /* Dark mode styles */
      .dark body {
        background-color: #070A12;
        color: #ededed;
      }
      /* Light mode styles */
      body {
        background-color: #ededed;
        color: #070A12;
      }
      html.dark body {
        background-color: #070A12;
        color: #ededed;
      }
      /* Custom scrollbar for webkit - Dark mode */
      .dark ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .dark ::-webkit-scrollbar-track {
        background: #070A12;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #ffcc29;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #e6b825;
      }
      /* Light mode scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #ededed;
      }
      ::-webkit-scrollbar-thumb {
        background: #070A12;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #1a1f2e;
      }
      /* Skeleton shimmer animation */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .skeleton-shimmer {
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      .dark .skeleton-shimmer {
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%);
        background-size: 200% 100%;
      }
          /* Hide standard browser password reveal and credential autofill icons */
      input[type="password"]::-ms-reveal,
      input[type="password"]::-ms-clear {
        display: none;
      }
      input::-webkit-credentials-auto-fill-button {
        visibility: hidden;
        display: none !important;
        pointer-events: none;
      }
    
      /* Fix WebKit autofill styling to match theme */
      .dark input:-webkit-autofill,
      .dark input:-webkit-autofill:hover,
      .dark input:-webkit-autofill:focus,
      .dark input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #070A12 inset !important;
        -webkit-text-fill-color: #ededed !important;
        transition: background-color 5000s ease-in-out 0s;
      }
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #f9fafb inset !important;
        -webkit-text-fill-color: #111827 !important;
        transition: background-color 5000s ease-in-out 0s;
      }
    </style>

}
</script>
