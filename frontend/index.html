<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Nebulaa - Your marketing, done for you</title>
    <!-- Tailwind CSS via Play CDN - more reliable -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Configure tailwind when it loads
      function configureTailwind() {
        if (typeof tailwind !== 'undefined' && tailwind.config) {
          tailwind.config = {
            darkMode: 'class',
            theme: {
              extend: {
                colors: {
                  nebula: {
                    dark: '#070A12',
                    gold: '#ffcc29',
                    silver: '#ededed',
                  },
                  // Gravity design system (v2 redesign)
                  gravity: {
                    bg:       '#0A0A0A',  // app background — deep warm black
                    sidebar:  '#111111',  // slightly lifted sidebar
                    surface:  '#151515',  // card / panel surface
                    surface2: '#1A1A1A',  // elevated card
                    border:   'rgba(255,255,255,0.06)',
                    borderStrong: 'rgba(255,255,255,0.10)',
                    gold:     '#F5A623',  // primary accent
                    goldSoft: 'rgba(245,166,35,0.15)',
                    text:     '#F5F4F1',  // warm off-white
                    textMuted:'rgba(255,255,255,0.55)',
                    textDim:  'rgba(255,255,255,0.35)',
                    success:  '#4ADE80',
                    info:     '#60A5FA',
                  }
                },
                fontFamily: {
                  serif: ['"Playfair Display"', 'Georgia', 'serif'],
                  sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                }
              }
            }
          };
          return true;
        }
        return false;
      }
      
      // Retry configuration
      var configRetries = 0;
      function tryConfigureTailwind() {
        if (!configureTailwind() && configRetries < 100) {
          configRetries++;
          setTimeout(tryConfigureTailwind, 50);
        }
      }
      tryConfigureTailwind();
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      /* Gravity redesign — applied when body has .gravity-shell class.
         Uses the token pair above so this now actually varies by theme —
         previously hardcoded dark regardless of .dark, which is why light
         mode had no visible effect on Gravity pages at all. */
      body.gravity-shell {
        background-color: var(--gv-bg) !important;
        color: var(--gv-text-primary) !important;
      }
      /* Ambient gold radial glow for the Gravity shell — subtle, top-right */
      body.gravity-shell::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(60% 45% at 78% 12%, rgba(245,166,35,0.10) 0%, rgba(245,166,35,0) 60%);
      }
      /* Serif display utility */
      .font-serif-display { font-family: 'Playfair Display', Georgia, serif; }

      /* ============================================================
         GRAVITY OVERRIDE LAYER
         Auto-restyles common Tailwind patterns on ALL pages when the
         Gravity shell is active — buttons, cards, inputs, borders,
         old yellow #ffcc29 becomes gold #F5A623, etc. Non-breaking.
         Light only: the dark-era classes (text-white, bg-slate-900,
         bg-white/5, ...) are mapped onto the cream --gv-* palette so
         text, boxes and borders keep WCAG AA contrast; text on a
         saturated/gradient fill or an intentionally dark surface keeps
         its light colour (see LIGHT SEMANTICS below).
         The LIGHT SEMANTICS block is GENERATED: edit the lists in
         frontend/scripts/visual-audit/gen-layer-lists.mjs and run
         `node scripts/visual-audit/gen-layer-lists.mjs` (a unit test
         fails while the block is out of date). New code should not rely
         on this layer: use the --gv-* tokens directly. An intentionally
         dark panel that no class identifies can carry
         data-nb-surface="dark".
         Known trade-off: high-alpha saturated fills (bg-red-500/90,
         /80) count as light tints, so their text is ink (4.8:1 on
         red-500/90) rather than white (3.7:1).
         Fills: the text colour on every coloured background the source
         uses (named Tailwind hues, arbitrary hex, brand colours,
         gradients by their worst stop, quoted inline hex) is the one with
         the HIGHER contrast, white or dark ink; white only when it also
         reaches 4.5:1. Fills where neither reaches 4.5:1 are listed in
         scripts/visual-audit/layer-needs-fix.json (page fix, Task 8).
         A hover:bg-* fill that fails both ways is darkened one shade
         when that makes white pass (danger buttons: red-500 -> red-600).
         Limit of the inline-style guard: an inline background colour
         that is NOT a quoted literal in the source (computed at runtime)
         forces light text via [style*="background-color: rgb("]. Known
         runtime inline backgrounds: Layout status dots (dotColor),
         GravityCalendar platform dots (PLATFORM_DOT), HeroVideo colour
         swatches, Analytics legend lines and `${color}20` tints (rgba,
         treated as light), Dashboard platform tiles (platform.bgColor)
         - all text-free leaves or tints except the Dashboard tiles.
         ============================================================ */
      body.gravity-shell {
        --grav-gold: #F5A623;
        --grav-gold-hover: #ffb833;
        /* Light semantics: the layer follows the cream palette (was the dark theme). */
        --grav-bg: var(--gv-bg);
        --grav-surface: var(--gv-panel);
        --grav-surface-2: var(--gv-panel-2);
        --grav-border: var(--gv-border-subtle);
        --grav-border-strong: var(--gv-border-default);
        --grav-text: var(--gv-text-primary);
        --grav-text-muted: var(--gv-text-tertiary);
      }
      /* ============================================================
         NEBULAA LIGHT PALETTE (warm cream)
         Values taken from nebulaa-ai-website/app/globals.css. The app is
         light only; the dark tokens below are kept unused.
         ============================================================ */
      :root {
        --gv-bg: #FBF5EA;
        --gv-panel: #FFFDF8;
        --gv-panel-2: #F3E8D4;
        --gv-ink-rgb: 20 32 58;
        --gv-text-primary: #14203A;
        --gv-text-secondary: #33405C;
        --gv-text-tertiary: #6D6250;
        --gv-text-muted: #8F836E;
        --gv-surface-1: rgb(var(--gv-ink-rgb) / 0.03);
        --gv-surface-2: rgb(var(--gv-ink-rgb) / 0.05);
        --gv-surface-3: rgb(var(--gv-ink-rgb) / 0.08);
        --gv-surface-4: rgb(var(--gv-ink-rgb) / 0.12);
        /* Borders: website rule colours (#E5D8BF / #D4C4A4), strong a step darker */
        --gv-border-subtle: #E5D8BF;
        --gv-border-default: #D4C4A4;
        --gv-border-strong: #BFAC85;
        --gv-accent: #F5A623;
        --gv-accent-text: #9A5A00;
        --gv-accent-display: #D07A00;
        /* Nebulaa accent family */
        --gv-coral: #EE6330;
        --gv-coral-text: #C4471A;
        --gv-peach: #FFE3D0;
        --gv-mint: #DDF2E6;
        --gv-sky: #DCEBFA;
        --gv-lav: #ECE6FB;
        --gv-shadow-card: 0 1px 2px rgba(20,32,58,.05), 0 12px 32px rgba(20,32,58,.07);
        --gv-accent-hover: #D68C0F;
        --gv-accent-fill: rgba(245,166,35,0.10);
        --gv-accent-ink: #1A1208;
        /* Raw channels so Tailwind's own /NN opacity-modifier syntax can be
           applied to the accent — a bare var(--gv-accent)/NN silently
           resolves to transparent, since Tailwind cannot inject an alpha
           channel into an opaque var() reference. Use
           rgb(var(--gv-accent-rgb)/0.NN) everywhere a translucent accent is
           needed. Verified live before this plan was dispatched. Identical
           in both themes (the accent hue itself does not change), so this
           is declared once here and not repeated under .dark. */
        --gv-accent-rgb: 245 166 35;
        /* Signature glow behind tile art and hero bands: two logo-gold/amber hues and one cool tint, very low opacity. */
        --gv-glow-gold: rgb(255 203 46 / 0.30);
        --gv-glow-amber: rgb(245 166 35 / 0.20);
        --gv-glow-cool: rgb(120 170 230 / 0.18);
      }
      /* ============================================================
         TILES AND THE SIGNATURE GLOW (components/Tile.tsx, TileGrid.tsx, DarkPanel.tsx)
         Plain CSS on purpose: nothing here is compiled in the browser by the Tailwind CDN, so tiles
         add no style work at start-up. Accent colours match utils/tiles.ts (a test keeps them equal).
         Motion (hover lift and glow) only runs when the visitor has not asked for reduced motion.
         ============================================================ */
      .nb-tile-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
      @media (min-width: 640px) {
        .nb-tile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        .nb-tile-grid > .nb-tile[data-variant="hero"] { grid-column: span 2; }
      }
      @media (min-width: 1024px) {
        .nb-tile-grid { grid-template-columns: repeat(var(--nb-cols, 3), minmax(0, 1fr)); gap: 20px; }
      }
      .nb-tile {
        --tile-bar: #F5A623; --tile-tint: #FFF0C7; --tile-glow-rgb: 245 166 35;
        position: relative; display: flex; flex-direction: column; box-sizing: border-box; width: 100%; min-width: 0;
        margin: 0; padding: 0; text-align: left; text-decoration: none; font: inherit; color: var(--gv-text-primary);
        background: rgb(255 255 255 / 0.78); border: 1px solid var(--gv-border-subtle); border-radius: 20px;
        box-shadow: var(--gv-shadow-card); overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      .nb-tile::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--tile-bar); z-index: 2; }
      .nb-tile[data-accent="create"] { --tile-bar: #F5A623; --tile-tint: #FFF0C7; --tile-glow-rgb: 245 166 35; }
      .nb-tile[data-accent="review"] { --tile-bar: #3E8B5A; --tile-tint: #DDF2E6; --tile-glow-rgb: 62 139 90; }
      .nb-tile[data-accent="inbox"] { --tile-bar: #3B82C4; --tile-tint: #DCEBFA; --tile-glow-rgb: 59 130 196; }
      .nb-tile[data-accent="performance"] { --tile-bar: #7B5CC4; --tile-tint: #ECE6FB; --tile-glow-rgb: 123 92 196; }
      .nb-tile[data-accent="plan"] { --tile-bar: #1F9D9A; --tile-tint: #D6F1EF; --tile-glow-rgb: 31 157 154; }
      .nb-tile[data-accent="brand"] { --tile-bar: #D8527A; --tile-tint: #FBDCE5; --tile-glow-rgb: 216 82 122; }
      .nb-tile[data-accent="competitors"] { --tile-bar: #EE6330; --tile-tint: #FFE3D0; --tile-glow-rgb: 238 99 48; }
      .nb-tile[data-accent="video"] { --tile-bar: #5B6BDC; --tile-tint: #E1E5FB; --tile-glow-rgb: 91 107 220; }
      .nb-tile[data-accent="photoshoot"] { --tile-bar: #A63EBB; --tile-tint: #F4E1F8; --tile-glow-rgb: 166 62 187; }
      .nb-tile:hover:not(:disabled) { border-color: var(--gv-border-default); }
      .nb-tile:focus-visible { outline: 3px solid #14203A; outline-offset: 3px; }
      .nb-tile[data-selected="true"] { border-color: var(--tile-bar); box-shadow: 0 0 0 2px var(--tile-bar), var(--gv-shadow-card); }
      .nb-tile:disabled, .nb-tile[data-disabled="true"] { opacity: 0.6; cursor: not-allowed; }
      .nb-tile-art {
        position: relative; display: block; flex: none; aspect-ratio: 4 / 3; overflow: hidden;
        background:
          radial-gradient(70% 80% at 16% 12%, var(--gv-glow-gold), transparent 70%),
          radial-gradient(70% 80% at 90% 94%, var(--gv-glow-amber), transparent 70%),
          radial-gradient(60% 70% at 92% 8%, var(--gv-glow-cool), transparent 70%),
          var(--tile-tint);
      }
      .nb-tile-artwrap { position: absolute; inset: 0; display: block; }
      .nb-tile-artwrap > svg, .nb-tile-art > img { display: block; width: 100%; height: 100%; }
      .nb-tile-art > img { position: absolute; inset: 0; object-fit: cover; }
      .nb-tile[data-locked="true"] .nb-tile-artwrap > svg, .nb-tile[data-locked="true"] .nb-tile-art > img { filter: saturate(0.5); opacity: 0.85; }
      .nb-tile-go {
        position: absolute; right: 10px; bottom: 10px; display: inline-flex; align-items: center; justify-content: center;
        width: 32px; height: 32px; border-radius: 999px; background: #FFFFFF; color: #14203A;
        box-shadow: 0 2px 8px rgba(20, 32, 58, 0.18);
      }
      .nb-tile-mark {
        position: absolute; left: 10px; top: 14px; display: inline-flex; align-items: center; justify-content: center;
        width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; color: #14203A; box-shadow: 0 2px 6px rgba(20, 32, 58, 0.16);
      }
      .nb-tile-check { left: auto; right: 10px; background: var(--tile-bar); }
      .nb-tile-body { display: flex; flex-direction: column; flex: 1; gap: 4px; min-width: 0; padding: 14px 16px 16px; }
      .nb-tile-title {
        display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin: 0;
        font-size: 17px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; overflow-wrap: anywhere;
      }
      .nb-tile-sub { display: block; font-size: 13.5px; line-height: 1.45; color: var(--gv-text-secondary); overflow-wrap: anywhere; }
      .nb-tile-foot { display: block; margin-top: auto; padding-top: 8px; font-size: 12.5px; font-weight: 500; line-height: 1.4; color: var(--gv-text-tertiary); overflow-wrap: anywhere; }
      .nb-tile-badge {
        display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 1;
        letter-spacing: 0.01em; white-space: nowrap; color: #14203A; background: var(--tile-tint); border: 1px solid rgb(20 32 58 / 0.14);
      }
      .nb-tile[data-variant="compact"] { flex-direction: row; align-items: stretch; align-self: start; }
      .nb-tile[data-variant="compact"] .nb-tile-art { flex: 0 0 96px; width: 96px; aspect-ratio: auto; min-height: 76px; }
      .nb-tile[data-variant="compact"] .nb-tile-body { justify-content: center; padding: 10px 14px; }
      .nb-tile[data-variant="compact"] .nb-tile-title { font-size: 15px; }
      .nb-tile[data-variant="compact"] .nb-tile-go { display: none; }
      /* Phone rows: on a narrow screen a grid marked data-phone="row" shows each standard or idea tile as a row (picture left, text right), so a choice of four does not fill four screens. */
      @media (max-width: 639px) {
        .nb-tile-grid[data-phone="row"] > .nb-tile[data-variant="standard"], .nb-tile-grid[data-phone="row"] > .nb-tile[data-variant="idea"] { flex-direction: row; }
        .nb-tile-grid[data-phone="row"] > .nb-tile[data-variant="standard"] .nb-tile-art, .nb-tile-grid[data-phone="row"] > .nb-tile[data-variant="idea"] .nb-tile-art { flex: 0 0 40%; max-width: 160px; aspect-ratio: auto; min-height: 120px; }
        .nb-tile-grid[data-phone="row"] > .nb-tile .nb-tile-go { display: none; }
        .nb-tile-grid[data-phone="row"] > .nb-tile .nb-tile-body { justify-content: center; padding: 12px 14px; }
      }
      .nb-tile[data-variant="idea"] .nb-tile-art { aspect-ratio: 3 / 2; }
      .nb-tile[data-variant="idea"] .nb-tile-title { font-size: 15px; }
      .nb-tile[data-variant="idea"] .nb-tile-foot { padding-top: 6px; }
      /* Small choice tiles (Create content): one quiet, even row. A small framed picture beside the title,
         one line and a muted price below, no stripe, no arrow, no tick; the current one has a thin gold ring.
         Big illustrated tiles belong on hero and landing areas only, never above a form. */
      .nb-tile-grid[data-size="small"] { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      @media (min-width: 640px) { .nb-tile-grid[data-size="small"] { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } }
      @media (min-width: 1024px) { .nb-tile-grid[data-size="small"] { grid-template-columns: repeat(var(--nb-cols, 5), minmax(0, 1fr)); gap: 12px; } }
      .nb-tile[data-variant="choice"] {
        display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto 1fr; column-gap: 9px; align-items: center;
        padding: 10px 11px 9px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(20, 32, 58, 0.04);
      }
      .nb-tile[data-variant="choice"]::before { display: none; }
      .nb-tile[data-variant="choice"] .nb-tile-art {
        grid-column: 1; grid-row: 1; width: 38px; height: 30px; aspect-ratio: auto; border-radius: 8px;
        background: #FBF6EC; box-shadow: inset 0 0 0 1px rgb(20 32 58 / 0.06);
      }
      .nb-tile[data-variant="choice"] .nb-tile-artwrap > svg { transform: scale(1.18); }
      .nb-tile[data-variant="choice"] .nb-tile-body { display: contents; }
      .nb-tile[data-variant="choice"] .nb-tile-title { grid-column: 2; grid-row: 1; font-size: 13.5px; font-weight: 650; line-height: 1.25; letter-spacing: -0.005em; }
      .nb-tile[data-variant="choice"] .nb-tile-sub { grid-column: 1 / -1; grid-row: 2; margin-top: 6px; font-size: 12px; line-height: 1.3; }
      .nb-tile[data-variant="choice"] .nb-tile-foot { grid-column: 1 / -1; grid-row: 3; align-self: end; margin-top: 0; padding-top: 3px; font-size: 11px; line-height: 1.3; font-weight: 500; color: var(--gv-text-tertiary); }
      .nb-tile[data-variant="choice"][data-selected="true"] { border-color: var(--gv-accent); background: #FFFCF4; box-shadow: 0 0 0 1px var(--gv-accent), 0 1px 2px rgba(20, 32, 58, 0.04); }
      @media (min-width: 640px) {
        .nb-tile[data-variant="hero"] { flex-direction: row; }
        .nb-tile[data-variant="hero"] .nb-tile-art { flex: 0 0 46%; aspect-ratio: auto; min-height: 200px; }
        .nb-tile[data-variant="hero"] .nb-tile-body { justify-content: center; padding: 22px 26px; gap: 6px; }
        .nb-tile[data-variant="hero"] .nb-tile-title { font-size: 24px; }
        .nb-tile[data-variant="hero"] .nb-tile-sub { font-size: 15px; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .nb-tile { transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease; }
        .nb-tile:hover:not(:disabled):not([data-disabled="true"]) {
          transform: translateY(-3px);
          box-shadow: 0 2px 4px rgba(20, 32, 58, 0.06), 0 18px 40px rgb(var(--tile-glow-rgb) / 0.30);
        }
        .nb-tile[data-selected="true"]:hover { box-shadow: 0 0 0 2px var(--tile-bar), 0 18px 40px rgb(var(--tile-glow-rgb) / 0.30); }
        .nb-tile .nb-tile-go { transition: transform 0.18s ease; }
        .nb-tile:hover:not(:disabled) .nb-tile-go { transform: translateX(3px); }
        .nb-tile[data-variant="choice"]:hover:not(:disabled):not([data-disabled="true"]) { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(20, 32, 58, 0.08); }
        .nb-tile[data-variant="choice"][data-selected="true"]:hover:not(:disabled) { box-shadow: 0 0 0 1px var(--gv-accent), 0 6px 16px rgba(20, 32, 58, 0.08); }
      }
      /* Deep-ink feature panel with a soft gold glow border. Use sparingly: two or three per page at most. */
      .nb-darkpanel {
        position: relative; box-sizing: border-box; padding: 24px; border-radius: 24px; color: #FBF5EA;
        background: radial-gradient(80% 120% at 100% 0%, rgb(245 166 35 / 0.22), transparent 60%), linear-gradient(160deg, #18274A, #0F1830);
        border: 1px solid rgb(245 166 35 / 0.45);
        box-shadow: 0 0 0 1px rgb(245 166 35 / 0.12), 0 16px 48px -16px rgb(245 166 35 / 0.45);
      }
      .nb-darkpanel-eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #F5A623; }
      .nb-darkpanel-title { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25; color: #FBF5EA; overflow-wrap: anywhere; }
      .nb-darkpanel-text { margin: 8px 0 0; font-size: 14.5px; line-height: 1.55; color: #D9D2C0; }
      .nb-darkpanel-action { margin-top: 16px; }
      .nb-darkpanel .nb-tile { background: #FFFDF8; }
      /* INTENTIONALLY UNUSED: Nebulaa is light only (ThemeContext never adds
         the `dark` class). Kept so a dark theme can return later. */
      .dark {
        --gv-bg: #0A0A0A;
        --gv-panel: #151515;
        --gv-panel-2: #1A1A1A;
        --gv-ink-rgb: 245 244 241;
        --gv-text-primary: #F5F4F1;
        --gv-text-secondary: #C9C6BE;
        --gv-text-tertiary: #8A8780;
        --gv-text-muted: #6E6B65;
        --gv-surface-2: rgb(var(--gv-ink-rgb) / 0.06);
        --gv-surface-3: rgb(var(--gv-ink-rgb) / 0.10);
        --gv-surface-4: rgb(var(--gv-ink-rgb) / 0.14);
        --gv-border-subtle: rgb(var(--gv-ink-rgb) / 0.06);
        --gv-border-default: rgb(var(--gv-ink-rgb) / 0.10);
        --gv-border-strong: rgb(var(--gv-ink-rgb) / 0.14);
        --gv-accent-text: #F5A623;
        --gv-accent-display: #F5A623;
        --gv-accent-hover: #ffb833;
        --gv-accent-fill: rgba(245,166,35,0.06);
      }
      /* ---- begin LIGHT SEMANTICS (generated by scripts/visual-audit/gen-layer-lists.mjs; do not edit by hand) ---- */
      /* 1. Surface context. Dark-era text classes read their colour from these variables, inherited,
         so the nearest surface wins: ink on the page and light panels; light on saturated fills and
         intentionally dark surfaces; dark ink on gold. All four rules have equal specificity (:where),
         so source order decides (tints after fills, light panels after dark surfaces). */
      body.gravity-shell {
        --nb-t1: var(--gv-text-primary);
        --nb-t2: var(--gv-text-secondary);
        --nb-t3: var(--gv-text-tertiary);
        --nb-acc: var(--gv-accent-text);
        --nb-green: #166534;
        --nb-emerald: #065F46;
        --nb-teal: #115E59;
        --nb-cyan: #155E75;
        --nb-sky: #075985;

      /* ------------------------------------------------------------------
         Metallic halo behind the Create prompt box.
         The BorderBeam package lights the 1px edge; this supplies the soft
         outward bloom that actually reads as "glowing". Cool white/steel so
         it never drifts amber against the app's gold accents.
         ------------------------------------------------------------------ */
      .metalHalo {
        position: absolute;
        inset: -18px;
        border-radius: 32px;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(60% 130% at 50% 0%,   rgba(245,166,35,0.30) 0%, rgba(245,166,35,0) 70%),
          radial-gradient(75% 150% at 50% 100%, rgba(255,196,84,0.20) 0%, rgba(255,196,84,0) 72%);
        filter: blur(26px);
        animation: metal-breathe 5.5s ease-in-out infinite;
      }
      /* Tight inner rim-light so the edge itself looks like lit gold. */
      .metalHalo::after {
        content: '';
        position: absolute;
        inset: 16px;
        border-radius: 18px;
        box-shadow: 0 0 30px 3px rgba(245,166,35,0.22);
      }
      @keyframes metal-breathe {
        0%, 100% { opacity: 0.60; }
        50%      { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .metalHalo { animation: none; opacity: 0.8; }
      }

      /* ------------------------------------------------------------------
         Marks the panel the current wizard step is about. Because steps are
         conditionally rendered, only the active step's panel exists in the
         DOM — so "one glow at a time, following the user" needs no state:
         every step panel carries this class and exactly one is ever mounted.

         Softer and wider than .metalHalo, which sits around a compact input;
         these panels are full-width and tall, so the same intensity would
         read as a glare rather than a glow.
         ------------------------------------------------------------------ */
      /* z-index:0 makes this its own stacking context, which matters inside a
         modal: the overlay there has its own background (and a backdrop-filter,
         which also creates a context), so a ::before at z-index:-1 painted
         behind that black overlay and was invisible. Keeping the context local
         means the glow stays behind the panel but above whatever is under it. */
      .gravity-glow { position: relative; z-index: 0; }
      .gravity-glow::before {
        content: '';
        position: absolute;
        inset: -14px;
        border-radius: 30px;
        pointer-events: none;
        z-index: -1;
        background:
          radial-gradient(55% 90% at 50% 0%,   rgba(245,166,35,0.16) 0%, rgba(245,166,35,0) 70%),
          radial-gradient(65% 100% at 50% 100%, rgba(255,196,84,0.11) 0%, rgba(255,196,84,0) 72%);
        filter: blur(22px);
        animation: metal-breathe 5.5s ease-in-out infinite;
      }
      /* Warm the panel edge itself so the glow looks like it belongs to the
         card rather than sitting behind it. */
      .gravity-glow {

        box-shadow: inset 0 1px 0 0 rgba(255,214,150,0.07);
      }
      @media (prefers-reduced-motion: reduce) {
        .gravity-glow::before { animation: none; opacity: 0.85; }
      }

      .igWrap {

        -webkit-mask-repeat: no-repeat, no-repeat;
        mask-repeat: no-repeat, no-repeat;
        -webkit-mask-size: 52% 46%, 40% 40%;
        mask-size: 52% 46%, 40% 40%;
        -webkit-mask-position: 16% 20%, 30% 32%;
        mask-position: 16% 20%, 30% 32%;
