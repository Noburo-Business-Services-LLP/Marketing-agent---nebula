server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Level 5: nearly the size of level 9 at a fraction of the CPU. gzip_proxied any compresses answers that came
    # through a load balancer or CDN (they add a Via header, which otherwise switches compression off).
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json font/ttf font/otf image/x-icon;

    # static assets — long cache, immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # proxy API calls to the backend container.
    # BACKEND_HOST is substituted at container start via envsubst (nginx-alpine template feature).
    # ECS task definition / docker-compose should set BACKEND_HOST=<backend-service-host>:5000.
    location /api/ {
        proxy_pass http://${BACKEND_HOST};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # index.html names the hashed bundles, so it must always revalidate.
    # With no Cache-Control nginx sends only Last-Modified/ETag, and browsers
    # fall back to heuristic caching — they keep serving the previous deploy's
    # index.html, which points at a bundle cached "immutable" for a year. The
    # result is a deploy that never reaches anyone until they hard-refresh.
    # Content-Security-Policy in REPORT-ONLY mode: the same policy as backend/config/csp.js (a backend test keeps them
    # equal). Browsers report to /api/csp-report; nothing is blocked. add_header in a location replaces the server's,
    # so it is repeated in each location that serves the app page.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.amazonaws.com https://images.unsplash.com https://*.cdninstagram.com https://*.fbcdn.net https://ui-avatars.com; media-src 'self' data: blob: https://res.cloudinary.com https://*.amazonaws.com https://www.soundhelix.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com https://res.cloudinary.com https://*.amazonaws.com https://challenges.cloudflare.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-report" always;
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback — React Router handles unknown paths
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.amazonaws.com https://images.unsplash.com https://*.cdninstagram.com https://*.fbcdn.net https://ui-avatars.com; media-src 'self' data: blob: https://res.cloudinary.com https://*.amazonaws.com https://www.soundhelix.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com https://res.cloudinary.com https://*.amazonaws.com https://challenges.cloudflare.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-report" always;
        expires -1;
    }
}
