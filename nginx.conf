server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # static assets — long cache, immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # proxy API calls to the backend container.
    # BACKEND_HOST is substituted at container start via envsubst (nginx-alpine template feature).
    # ECS task definition / docker-compose should set BACKEND_HOST=<backend-service-host>:5000.
    location /api/ {
        proxy_pass http://${BACKEND_HOST};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # index.html names the hashed bundles, so it must always revalidate.
    # With no Cache-Control nginx sends only Last-Modified/ETag, and browsers
    # fall back to heuristic caching — they keep serving the previous deploy's
    # index.html, which points at a bundle cached "immutable" for a year. The
    # result is a deploy that never reaches anyone until they hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback — React Router handles unknown paths
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }
}
