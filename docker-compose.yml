services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nebulaa-app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    volumes:
      - nebulaa_storage:/app/backend/storage
      - nebulaa_temp:/app/backend/temp
    depends_on:
      mongo:
        condition: service_started

  mongo:
    image: mongo:7
    container_name: nebulaa-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  nebulaa_storage:
  nebulaa_temp:
