# Single-machine run of the API with a local MongoDB (local use and testing; production runs the images on ECS, see
# docs/superpowers/ops/ecs-web-worker.md). The API port is bound to this machine only (127.0.0.1): it is never
# public. The ngrok tunnel that used to start with it was removed (it published port 5000 to the internet, around the
# load balancer and its limits); for a temporary tunnel on a developer machine use docker-compose.tunnel.yml:
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nebulaa-app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      VIDEO_FALLBACK_ALLOWED: "true"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - nebulaa_storage:/app/backend/storage
      - nebulaa_temp:/app/backend/temp
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: nebulaa-mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  nebulaa_storage:
  nebulaa_temp:
